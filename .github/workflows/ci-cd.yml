name: 🚀 JJ Swim Lab CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  NPM_VERSION: '9'

jobs:
  # 🔍 코드 품질 검사
  code-quality:
    name: 📋 코드 품질 검사
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🟢 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📦 의존성 설치
      run: |
        npm ci
        cd client && npm ci
        cd ../server && npm ci
        
    - name: 🔍 ESLint 검사
      run: |
        npm run lint:client
        npm run lint:server
        
    - name: 🔍 TypeScript 타입 검사
      run: |
        npm run type-check:client
        npm run type-check:server
        
    - name: 🎨 Prettier 포맷 검사
      run: npm run format:check

  # 🧪 테스트 실행
  test:
    name: 🧪 테스트 실행
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🟢 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📦 의존성 설치
      run: |
        npm ci
        cd client && npm ci
        cd ../server && npm ci
        
    - name: 🧪 클라이언트 테스트
      run: |
        cd client
        npm run test:ci
        
    - name: 🧪 서버 테스트
      run: |
        cd server
        npm run test:ci
        
    - name: 📊 테스트 커버리지 업로드
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # 🏗️ 빌드 및 성능 검사
  build:
    name: 🏗️ 빌드 및 성능 검사
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🟢 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📦 의존성 설치
      run: |
        npm ci
        cd client && npm ci
        cd ../server && npm ci
        
    - name: 🏗️ 클라이언트 빌드
      run: |
        cd client
        npm run build:prod
        
    - name: 🏗️ 서버 빌드
      run: |
        cd server
        npm run build
        
    - name: 📊 번들 크기 분석
      run: |
        cd client
        npm run bundle:analyze
        
    - name: 📊 성능 체크
      run: |
        cd client
        npm run performance
        
    - name: 💾 빌드 아티팩트 저장
      uses: actions/upload-artifact@v3
      with:
        name: build-files
        path: |
          client/.next/
          server/dist/
        retention-days: 7

  # 🚀 스테이징 배포
  deploy-staging:
    name: 🚀 스테이징 배포
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🟢 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📦 의존성 설치
      run: |
        npm ci
        cd client && npm ci
        cd ../server && npm ci
        
    - name: 🏗️ 프로덕션 빌드
      run: |
        cd client
        npm run build:prod
        cd ../server
        npm run build
        
    - name: 🚀 Vercel 스테이징 배포
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        vercel-args: '--target=preview'

  # 🚀 프로덕션 배포
  deploy-production:
    name: 🚀 프로덕션 배포
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🟢 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📦 의존성 설치
      run: |
        npm ci
        cd client && npm ci
        cd ../server && npm ci
        
    - name: 🏗️ 프로덕션 빌드
      run: |
        cd client
        npm run build:prod
        cd ../server
        npm run build
        
    - name: 🚀 Vercel 프로덕션 배포
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        vercel-args: '--prod'

  # 📊 성능 모니터링
  performance-monitoring:
    name: 📊 성능 모니터링
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🟢 Node.js 설정
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: 📦 의존성 설치
      run: |
        npm ci
        cd client && npm ci
        
    - name: 📊 Lighthouse 성능 테스트
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './client/.lighthouserc.js'
        uploadArtifacts: true
        temporaryPublicStorage: true
        
    - name: 📊 번들 크기 모니터링
      run: |
        cd client
        npm run bundle:size
        
    - name: 📊 성능 리포트 생성
      run: |
        cd client
        npm run performance > performance-report.txt
        
    - name: 💾 성능 리포트 저장
      uses: actions/upload-artifact@v3
      with:
        name: performance-reports
        path: |
          client/performance-report.txt
          .lighthouseci/
        retention-days: 30

  # 🔔 알림 및 보고
  notifications:
    name: 🔔 알림 및 보고
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, performance-monitoring]
    if: always()
    
    steps:
    - name: 📊 배포 상태 요약
      run: |
        echo "## 🚀 배포 상태 요약" >> $GITHUB_STEP_SUMMARY
        echo "- **스테이징**: ${{ needs.deploy-staging.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **프로덕션**: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **성능 모니터링**: ${{ needs.performance-monitoring.result }}" >> $GITHUB_STEP_SUMMARY
        
    - name: 🔔 Slack 알림
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🚀 JJ Swim Lab 배포 완료!
          - 브랜치: ${{ github.ref_name }}
          - 커밋: ${{ github.sha }}
          - 상태: ${{ job.status }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: always()
