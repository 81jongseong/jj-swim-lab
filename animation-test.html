<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB 애니메이션 테스트</title>
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #container { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        <div>GLB 애니메이션 테스트</div>
        <div id="status">로딩 중...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 씬 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x222222);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        document.getElementById('container').appendChild(renderer.domElement);

        // 조명 설정
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // 컨트롤 설정
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 카메라 위치
        camera.position.set(0, 2, 5);
        controls.target.set(0, 1, 0);
        controls.update();

        // 애니메이션 변수
        let mixer = null;
        let model = null;
        const clock = new THREE.Clock();

        // 상태 업데이트 함수
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
            console.log('[STATUS]', message);
        }

        // GLB 로드 함수
        function loadGLB() {
            const loader = new THREE.GLTFLoader();
            
            // 실제 GLB 파일 경로로 변경하세요
            const glbPath = '/api/video-upload/download/video-1757080486551-934593861/glb';
            
            updateStatus('GLB 파일 로딩 중...');
            
            loader.load(
                glbPath,
                function(gltf) {
                    console.log('[DEBUG] GLB 로드 성공:', gltf);
                    console.log('[DEBUG] 애니메이션 개수:', gltf.animations?.length || 0);
                    
                    if (gltf.animations && gltf.animations.length > 0) {
                        console.log('[DEBUG] 애니메이션 클립들:');
                        gltf.animations.forEach((clip, index) => {
                            console.log(`[DEBUG] 클립 ${index}: ${clip.name}, 길이: ${clip.duration}초`);
                        });
                    } else {
                        console.warn('[WARNING] 애니메이션이 없습니다!');
                        updateStatus('애니메이션 없음');
                        return;
                    }

                    // 모델을 씬에 추가
                    if (gltf.scene) {
                        model = gltf.scene;
                        
                        // 모델 크기 조정
                        const box = new THREE.Box3().setFromObject(model);
                        const size = box.getSize(new THREE.Vector3());
                        const maxDimension = Math.max(size.x, size.y, size.z);
                        const scale = 2 / maxDimension;
                        
                        model.scale.setScalar(scale);
                        model.position.y = -box.min.y * scale;
                        
                        // 그림자 설정
                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        
                        scene.add(model);
                        
                        // SkinnedMesh 확인
                        const skinnedMeshes = [];
                        model.traverse((child) => {
                            if (child.isSkinnedMesh) {
                                skinnedMeshes.push(child);
                            }
                        });
                        console.log('[DEBUG] SkinnedMesh 개수:', skinnedMeshes.length);
                        console.log('[DEBUG] SkinnedMesh들:', skinnedMeshes.map(mesh => mesh.name));
                        
                        updateStatus(`모델 로드 완료 (SkinnedMesh: ${skinnedMeshes.length}개)`);
                    }

                    // 애니메이션 믹서 설정
                    if (gltf.animations && gltf.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(model);
                        
                        // 첫 번째 애니메이션 재생
                        const clip = gltf.animations[0];
                        console.log(`[DEBUG] 애니메이션 재생 시작: ${clip.name} (${clip.duration}초)`);
                        
                        const action = mixer.clipAction(clip);
                        action.setLoop(THREE.LoopRepeat, Infinity);
                        action.play();
                        
                        console.log('[DEBUG] 액션 재생 상태:', action.isRunning());
                        console.log('[DEBUG] 액션 가중치:', action.getEffectiveWeight());
                        
                        updateStatus(`애니메이션 재생 중: ${clip.name}`);
                    }
                },
                function(progress) {
                    const percent = (progress.loaded / progress.total) * 100;
                    updateStatus(`로딩 중... ${percent.toFixed(1)}%`);
                },
                function(error) {
                    console.error('[ERROR] GLB 로드 실패:', error);
                    updateStatus('GLB 로드 실패');
                }
            );
        }

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            // 컨트롤 업데이트
            controls.update();
            
            // 애니메이션 믹서 업데이트
            if (mixer) {
                mixer.update(delta);
                
                // 디버그: 액션 상태 확인
                if (mixer._actions && mixer._actions.length > 0) {
                    const action = mixer._actions[0];
                    if (action && action.isRunning()) {
                        // 1초마다 한 번만 로그 출력
                        if (Math.floor(action.time * 10) % 10 === 0) {
                            console.log(`[DEBUG] 애니메이션 재생 중: 시간 ${action.time.toFixed(2)}초`);
                        }
                    } else {
                        // 액션이 중지된 경우 재시작
                        console.log('[DEBUG] 액션이 중지됨. 재시작 시도...');
                        action.play();
                    }
                }
            }
            
            // 렌더링
            renderer.render(scene, camera);
        }

        // 윈도우 리사이즈
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 시작
        loadGLB();
        animate();
    </script>
</body>
</html>
